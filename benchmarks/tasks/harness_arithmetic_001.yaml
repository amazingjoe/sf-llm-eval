version: 1

# Benchmark task: safe to show to the model. The answer key lives in the
# fixture below and is read only by evaluator.py.
test:
  id: harness_arithmetic_001
  name: Harness health check (arithmetic)
  prompt: >
    What is 2 + 3?
  success_criteria: >
    State the numeric result of the calculation.
  fixture: ../fixtures/harness_arithmetic_001.yaml
  metadata:
    category: harness_health_check
    difficulty: trivial
    benchmark_group: health_checks
    notes: >
      Exercises the task/fixture split end to end without Salesforce.

# The harness adds the benchmark.finish tool and a fixed instruction to the
# system prompt. A missing finish signal is reported, not failed.
completion:
  required: true

# Subject model/provider come from the parent test-set.
# Normalizer and evaluator models come from config.yaml.
request:
  system_prompt: >
    You are an assistant. Complete the user's task accurately and concisely.

  parameters:
    temperature: 0
    max_tokens: 100
    top_p: 1

  extra_payload: {}

  headers:
    X-Title: "Salesforce Open Model Benchmark - Health Check"

  timeout_seconds: 60
  tools: []

pipeline:
  normalizer:
    enabled: true
    script: "normalizer.py"

    parameters:
      temperature: 0
      max_tokens: 200

    instructions: >
      Extract only the numerical result of the calculation explicitly present
      in the subject model's answer. Do not fix the answer, add outside knowledge,
      or infer missing values. If a requested value is not present, use null.

    schema:
      type: object
      additionalProperties: false
      required:
        - result
      properties:
        result:
          type: ["number", "integer", "null"]

    extra_payload: {}
    timeout_seconds: 60

  # Checks come from the fixture file, never from the task.
  evaluator:
    enabled: true
    script: "evaluator.py"
    require_schema_valid: true
