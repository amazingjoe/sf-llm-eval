version: 1

test:
  id: schema_cache_warm_001
  name: Read warm Salesforce schema-cache entries
  prompt: >
    Run the required Salesforce schema discovery calls, then reply with a brief
    confirmation that both completed.
  metadata:
    category: schema_cache_validation
    difficulty: trivial
    benchmark_group: manual_validation
    notes: >
      Reads the same list and describe entries seeded by the prior test without
      requesting refresh; both results should be cache hits.

request:
  system_prompt: >
    Before answering, make exactly these two tool calls in order:
    1. salesforce_list_sobjects with {"category":"custom"}
    2. salesforce_describe with {"sobject":"Account"}
    Do not call salesforce_query and do not set refresh. After both calls,
    respond concisely.
  parameters:
    temperature: 0
    max_tokens: 150
    top_p: 1
  extra_payload: {}
  headers:
    X-Title: "Salesforce Schema Cache - Warm Read"
  timeout_seconds: 180
  max_rounds: 4
  tools:
    - salesforce.list_sobjects
    - salesforce.describe

pipeline:
  normalizer:
    enabled: false
  evaluator:
    enabled: false
