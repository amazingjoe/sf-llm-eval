version: 1

test:
  id: harness_test_001
  name: Harness health check (2 + 3)
  prompt: >
    What is 2 + 3? Provide the answer.
  metadata:
    category: harness_health_check
    difficulty: trivial
    benchmark_group: health_checks
    notes: >
      A minimal health check designed to verify that the harness itself
      (runner, logging, normalizer, and evaluator) is functioning correctly.

# Subject model/provider come from the parent test-set.
# Normalizer and evaluator models come from config.yaml.
request:
  system_prompt: >
    You are an assistant. Complete the user's task accurately and concisely.

  parameters:
    temperature: 0
    max_tokens: 100
    top_p: 1

  # Optional provider-specific request fields can go here.
  extra_payload: {}

  # Optional extra headers merged on top of the test-set headers.
  headers:
    X-Title: "Salesforce Open Model Benchmark - Health Check"

  timeout_seconds: 60

  # Future Salesforce/tool-calling tests can place OpenAI-compatible tool
  # definitions here. runner.py passes them through unchanged.
  tools: []

pipeline:
  normalizer:
    enabled: true
    script: "normalizer.py"

    parameters:
      temperature: 0
      max_tokens: 200

    instructions: >
      Extract only the numerical result of the calculation explicitly present
      in the subject model's answer. Do not fix the answer, add outside knowledge,
      or infer missing values. If a requested value is not present, use null.

    # The normalized shape used by the deterministic evaluator.
    schema:
      type: object
      additionalProperties: false
      required:
        - result
      properties:
        result:
          type: ["number", "integer", "null"]

    # Optional provider-specific fields. For models that reliably support
    # structured outputs through OpenRouter, response_format can be added here.
    extra_payload: {}

    timeout_seconds: 60

  evaluator:
    enabled: true
    script: "evaluator.py"
    require_schema_valid: true

    checks:
      - name: Calculation result is 5
        field: result
        op: numeric_equals
        expected: 5
