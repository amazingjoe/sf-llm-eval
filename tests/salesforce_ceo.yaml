version: 1

test:
  id: salesforce_ceo_001
  name: Current CEO of Salesforce
  prompt: >
    Who is the current CEO of Salesforce? Use web search if you need
    up-to-date information. Answer with the person's name.
  metadata:
    category: web_search
    difficulty: easy
    benchmark_group: live_retrieval
    notes: >
      Smoke test for OpenRouter server-side web search. The harness does not
      run search itself; OpenRouter executes openrouter:web_search. This is a
      live-web check, so the expected name may need updating if leadership
      changes.

# Subject model/provider come from the parent test-set.
# Normalizer and evaluator models come from config.yaml.
request:
  system_prompt: >
    You are an assistant. Complete the user's task accurately and concisely.
    When you need current facts, use the available web search tool.

  parameters:
    temperature: 0
    max_tokens: 400
    top_p: 1

  extra_payload: {}

  headers:
    X-Title: "Salesforce Open Model Benchmark - Web Search"

  timeout_seconds: 180
  max_rounds: 4
  max_tool_calls: 4

  # Shorthand: runner.py translates this to OpenRouter's server-side tool.
  # OpenRouter executes the search; this harness does not.
  tools:
    - web_search

pipeline:
  normalizer:
    enabled: true
    script: "normalizer.py"

    parameters:
      temperature: 0
      max_tokens: 200

    instructions: >
      Extract only the CEO's name explicitly present in the subject model's
      answer. Do not fix the answer, add outside knowledge, or infer missing
      values. If a requested value is not present, use null.

    schema:
      type: object
      additionalProperties: false
      required:
        - ceo_name
      properties:
        ceo_name:
          type: ["string", "null"]

    extra_payload: {}
    timeout_seconds: 60

  evaluator:
    enabled: true
    script: "evaluator.py"
    require_schema_valid: true

    checks:
      - name: CEO name is Marc Benioff
        field: ceo_name
        op: case_insensitive_equals
        expected: "Marc Benioff"
