version: 1

test:
  id: account_lookup_001
  name: Easy Salesforce account lookup
  prompt: >
    Find the Salesforce Account named "Acme Incorporated" and return the
    company's name, number of employees, and industry. Use the Salesforce
    query tool to look this up in the connected org.
  metadata:
    category: salesforce_record_operations
    difficulty: easy
    benchmark_group: crm_retrieval
    notes: >
      Requires a connected Salesforce org (alias harness-org by default)
      that contains an Account named Acme Incorporated.

# Subject model/provider come from the parent test-set.
# Normalizer and evaluator models come from config.yaml.
request:
  system_prompt: >
    You are an assistant working with Salesforce. Use the salesforce_query
    tool to run SOQL against the connected org. Do not guess org data.
    Complete the user's task accurately and concisely.

  parameters:
    temperature: 0
    max_tokens: 800
    top_p: 1

  # Optional provider-specific request fields can go here.
  extra_payload: {}

  # Optional extra headers merged on top of the test-set headers.
  headers:
    X-Title: "Salesforce Open Model Benchmark"

  timeout_seconds: 180
  max_rounds: 6

  # Shorthand: runner.py expands these into OpenAI function tools and
  # executes them locally via the Salesforce CLI provider.
  tools:
    - salesforce.query

pipeline:
  normalizer:
    enabled: true
    script: "normalizer.py"

    parameters:
      temperature: 0
      max_tokens: 500

    instructions: >
      Extract only facts explicitly present in the subject model's answer.
      Do not fix the answer, add outside knowledge, or infer missing values.
      If a requested value is not present, use null.

    # The normalized shape used by the deterministic evaluator.
    schema:
      type: object
      additionalProperties: false
      required:
        - company_name
        - number_of_employees
        - industry
      properties:
        company_name:
          type: ["string", "null"]
        number_of_employees:
          type: ["integer", "null"]
        industry:
          type: ["string", "null"]

    # Optional provider-specific fields. For models that reliably support
    # structured outputs through OpenRouter, response_format can be added here.
    extra_payload: {}

    timeout_seconds: 120

  evaluator:
    enabled: true
    script: "evaluator.py"
    require_schema_valid: true

    checks:
      - name: Company name is correct
        field: company_name
        op: case_insensitive_equals
        expected: "Acme Incorporated"

      - name: Employee count is correct
        field: number_of_employees
        op: numeric_equals
        expected: 350

      - name: Industry is correct
        field: industry
        op: case_insensitive_equals
        expected: "Manufacturing"
