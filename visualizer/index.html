<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench · Salesforce open-model harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23142033'/%3E%3Crect x='5' y='10' width='6' height='12' rx='1.5' fill='%230F7D68'/%3E%3Crect x='13' y='10' width='6' height='12' rx='1.5' fill='%23C0392B'/%3E%3Crect x='21' y='10' width='6' height='12' rx='1.5' fill='%23314EFF'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="top">
      <a class="brand" href="#">
        <span class="kicker" id="page-kicker">Salesforce open-model harness</span>
        <h1 id="page-title">Workbench</h1>
      </a>
      <nav class="nav" aria-label="Workbench">
        <a href="#runs" data-nav="runs">Runs</a>
        <a href="#tests" data-nav="tests">Tests</a>
        <a href="#suites" data-nav="suites">Suites</a>
        <a href="#config" data-nav="config">Config</a>
      </nav>
      <div class="top-actions">
        <label class="search" id="search-wrap" hidden>
          <span class="sr-only">Filter</span>
          <input id="filter" type="search" placeholder="Filter" autocomplete="off" />
        </label>
        <button type="button" id="save" class="primary" hidden>Save</button>
        <button type="button" id="refresh" class="ghost">Refresh</button>
      </div>
    </header>
    <main id="app">
      <p class="status-line">Opening workbench…</p>
    </main>
    <div id="toast" class="toast" hidden role="status"></div>
    <script src="app.js"></script>
    <script src="studio.js"></script>
  </body>
</html>
